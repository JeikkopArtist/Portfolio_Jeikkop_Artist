# Galería — se muestra en el mismo orden que aparece aquí.
# Para añadir una pieza: copia la imagen en src/assets/images/galeria/
# (nombre sin tildes ni espacios) y añade un bloque nuevo.
# category: 3d | 2d | personajes
#
# El mosaico se monta solo: las imágenes panorámicas ocupan 2×2 y las verticales 1×2.
# Si al añadir piezas queda un hueco al final, prueba a cambiar el orden de alguna.

